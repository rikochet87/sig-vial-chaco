<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e0e">
<title>Sin conexión — SIG Vial Chaco</title>
<style>
  html, body { margin: 0; height: 100%; background: #1A1A1A; color: #e8e8e8;
    font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box; }
  .caja { max-width: 420px; width: 100%; background: #121212; border: 1px solid #2a2a2a;
    border-left: 3px solid #F5C300; padding: 20px 22px; }
  .rot { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: #a0a0a0; margin: 0 0 10px; }
  h1 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
  p { font-size: 13px; line-height: 1.55; color: #c8c8c8; margin: 0 0 16px; }
  button { font: inherit; font-size: 12px; letter-spacing: 1px; text-transform: uppercase;
    background: transparent; color: #F5C300; border: 1px solid #F5C300; border-radius: 0;
    padding: 8px 14px; cursor: pointer; }
  button:hover { background: #F5C300; color: #0e0e0e; }
</style>
</head>
<body>
<main>
  <div class="caja">
    <p class="rot">SIG Vial Chaco</p>
    <h1>Sin conexión</h1>
    <p>El panel necesita conexión para mostrar los datos. Cuando vuelva la señal, la página se recarga sola.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </div>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
